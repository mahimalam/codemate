<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="leftArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="rightArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Subtle Border -->
  <rect x="38" y="38" width="436" height="436" rx="90" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Glowing Emblem -->
  <g filter="url(#glow)">
    <!-- Left Wing of V -->
    <path d="M 145 160 L 195 160 L 256 330 L 216 330 Z" fill="url(#leftArm)" />
    <!-- Right Wing of V -->
    <path d="M 367 160 L 317 160 L 256 330 L 296 330 Z" fill="url(#rightArm)" />
    <!-- Center Core Crystal -->
    <polygon points="256,210 286,260 256,310 226,260" fill="url(#coreGrad)" />
  </g>

  <!-- Terminal Code Accent -->
  <path d="M 210 370 L 230 385 L 210 400" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="246" y1="400" x2="286" y2="400" stroke="#c084fc" stroke-width="5" stroke-linecap="round" />
</svg>
